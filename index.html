      const isHidden = menu.classList.contains('hidden');
      
      menu.classList.toggle('hidden', !isHidden);

      iconClose.classList.toggle('hidden', !isHidden);

    function showToast(msg, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const styles = {
        success: 'bg-slate-900 text-emerald-400 border-emerald-500',
        error: 'bg-slate-900 text-red-400 border-red-500',
        info: 'bg-slate-900 text-white border-slate-700'
      };
      toast.className = `${styles[type]} fade-in pointer-events-auto text-xs px-4 py-3 rounded-lg shadow-xl border font-semibold`;
      toast.innerHTML = `<span>${msg}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 200);
      }, 3000);
    }

            <button class="px-4 py-2 bg-slate-900 text-white text-xs font-bold rounded-lg">View Project</button>
          </div>
        `;
        return;
      }

      grid.innerHTML = projects.map(p => `
        <div class="bg-white p-6 rounded-2xl border space-y-4 shadow-sm flex flex-col justify-between">
          <div class="space-y-2">
            <h3 class="font-bold text-slate-900 text-base">${p.title}</h3>
            <p class="text-xs text-slate-600 leading-relaxed">${p.description}</p>
            <p class="text-[11px] font-bold text-brandBlue">Built with: ${p.built_with}</p>
          </div>
          <div class="space-y-2 pt-2 border-t border-slate-100">
            ${p.live_url ? `<a href="${p.live_url}" target="_blank" class="block text-center py-2 bg-brandDark text-white text-xs font-bold rounded-xl hover:bg-slate-800">View Project</a>` : ''}
            <button onclick="likeProject('${p.id}', ${p.likes_count || 0})" class="w-full py-1.5 text-xs font-bold text-slate-600 hover:text-red-500 border rounded-lg flex items-center justify-center gap-1.5">
              <span>❤️ Like</span> <span id="likes-count-${p.id}">${p.likes_count || 0}</span>
            </button>
          </div>
        </div>
      `).join('');
    }

    async function likeProject(id, current) {
      const next = current + 1;
      const el = document.getElementById(`likes-count-${id}`);
      if (el) el.textContent = next;
      await db.from('projects').update({ likes_count: next }).eq('id', id);
      showToast('Liked!', 'success');
    }

    // --- CONTACT VIEW ---

              <div>
                <span class="font-bold text-slate-400 block">Email:</span>
                <a href="mailto:blessedtechhub5@gmail.com" class="text-brandBlue font-bold">blessedtechhub5@gmail.com</a>
              </div>
              <div>
                <span class="font-bold text-slate-400 block">Location:</span>
                <span class="font-bold text-slate-800">Monrovia, Liberia</span>

            <button type="submit" class="w-full py-2.5 bg-brandBlue hover:bg-blue-600 text-white font-bold text-xs rounded-lg transition">Send Message</button>
          </form>
        </div>
      `;
    }

    async function handleContactSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('c-name').value.trim();
      const email = document.getElementById('c-email').value.trim();
      const subject = document.getElementById('c-subject').value.trim();
      const message = document.getElementById('c-msg').value.trim();

      const { error } = await db.from('contact_messages').insert([{ name, email, subject, message }]);
      if (error) return showToast('Failed to send message: ' + error.message, 'error');

      showToast('Message sent successfully!', 'success');
      e.target.reset();
    }

          <div class="space-y-2">
            <h1 class="text-3xl font-black text-slate-900">Welcome Back.</h1>

            <div>

              <input id="l-pass" type="password" class="w-full p-2.5 border rounded-lg text-xs" />

            <button onclick="loginEmail()" class="w-full py-2.5 bg-brandBlue text-white font-bold text-xs rounded-lg hover:bg-blue-600">Log In</button>

            </p>
          </div>
        </div>
      `;
    }

    async function loginGoogle() {
      const { error } = await db.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin }
      });
      if (error) showToast('Auth error: ' + error.message, 'error');
    }

    async function loginEmail() {
      const email = document.getElementById('l-email').value.trim();
      const password = document.getElementById('l-pass').value.trim();
      if (!email || !password) return showToast('Fill all fields.', 'error');

      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) showToast('Login error: ' + error.message, 'error');
      else {
        showToast('Welcome back!', 'success');
        navigate('dashboard');
      }
    }

            <input id="ad-p-url" type="url" placeholder="Live URL (optional)" class="w-full p-2.5 border rounded-lg text-xs" />
            <textarea id="ad-p-desc" rows="3" placeholder="Short description..." class="w-full p-2.5 border rounded-lg text-xs"></textarea>

          </div>
        </div>
      `;
    }

    async function adminAddProject() {
      const title = document.getElementById('ad-p-title').value.trim();
      const built_with = document.getElementById('ad-p-built').value.trim();
      const live_url = document.getElementById('ad-p-url').value.trim();
      const description = document.getElementById('ad-p-desc').value.trim();

      if (!title || !built_with || !description) return showToast('Fill all fields.', 'error');

      const { error } = await db.from('projects').insert([{ title, built_with, live_url, description }]);
      if (error) return showToast('Error: ' + error.message, 'error');

      showToast('Project published!', 'success');
      navigate('projects');
    }
  </script>
