<!DOCTYPE html>

  <link rel="manifest" href="manifest.json">

      }

  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .fade-in-popup {
      animation: popupFadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes popupFadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-light-bg text-navy font-sans min-h-screen flex flex-col justify-between">

  <!-- Offline Banner -->
  <div id="offline-banner" class="hidden bg-amber-600 text-white text-[11px] font-bold text-center py-1 sticky top-0 z-[60]">

  <!-- Header Navigation -->

        </div>
      </button>
      
      <div class="hidden md:flex space-x-6 text-xs font-semibold">
        <button onclick="navigate('home')" class="hover:text-blue-400 transition-colors">Home</button>
        <button onclick="navigate('services')" class="hover:text-blue-400 transition-colors">Services</button>
        <button onclick="navigate('reviews')" class="hover:text-blue-400 transition-colors">Client Reviews</button>
        <button onclick="navigate('courses')" class="hover:text-blue-400 transition-colors">Academy</button>
        <button onclick="navigate('admin')" class="text-blue-400 font-bold hover:underline">Control Room</button>
      </div>

      <div class="flex items-center space-x-3">
        <button onclick="navigate('request')" class="bg-cobalt hover:bg-blue-700 px-4 py-2 rounded-xl text-xs font-bold text-white shadow transition-all">
          Start Project
        </button>
      </div>
    </div>

    <!-- Mobile Navigation Bar -->
    <div class="flex md:hidden justify-around py-2.5 border-t border-slate-800 text-[11px] bg-navy text-slate-300 font-medium">
      <button onclick="navigate('home')" class="p-1 hover:text-blue-400">Home</button>
      <button onclick="navigate('services')" class="p-1 hover:text-blue-400">Services</button>
      <button onclick="navigate('reviews')" class="p-1 hover:text-blue-400">Reviews</button>
      <button onclick="navigate('courses')" class="p-1 hover:text-blue-400">Academy</button>
      <button onclick="navigate('admin')" class="p-1 text-blue-400 font-bold">Control Room</button>
    </div>
  </nav>

  <!-- Main View Container -->
  <main id="app-content" class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6">
    <!-- Dynamic Views Inject Here -->
  </main>

  <!-- PWA Install Popup -->
  <div id="pwa-install-popup" class="hidden fixed bottom-5 right-5 left-5 sm:left-auto sm:max-w-sm z-50 bg-navy text-white p-5 rounded-2xl shadow-2xl border border-slate-700 fade-in-popup space-y-3">
    <div class="flex items-start justify-between">
      <div>
        <h4 class="font-bold text-sm text-white">Install Web App</h4>
        <p class="text-[11px] text-slate-400">Install B-TECH HUB on your home screen for quick access.</p>
      </div>
      <button onclick="dismissPwaPopup()" class="text-slate-400 hover:text-white text-xs font-bold">X</button>
    </div>
    <div class="flex space-x-2 pt-1">
      <button onclick="triggerPwaInstall()" class="flex-1 py-2 bg-blue-600 hover:bg-blue-700 font-bold text-xs text-white rounded-xl transition-all">Install</button>
      <button onclick="dismissPwaPopup()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300 rounded-xl">Dismiss</button>
    </div>
  </div>

  <!-- Toast Notification System -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

  <!-- Footer -->
  <footer class="bg-navy text-slate-400 text-xs py-8 border-t border-slate-800 mt-12 text-center space-y-2">
    <p>&copy; 2026 B-TECH HUB. Enterprise Software & Technical Education.</p>
    <p class="text-[10px] text-slate-500">Trusted by businesses, institutions, and independent software developers.</p>
  </footer>

  <script>
    // --- SUPABASE CONFIG ---
    const SUPABASE_URL = 'https://argvofusfdrwengshbqw.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyZ3ZvZnVzZmRyd2VuZ3NoYnF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNjkxOTIsImV4cCI6MjEwMzg0NTE5Mn0.lS8P1NhaWVhyW3XMHz5ErC-aIXq-wsMrV8I9RFxtXIE';
    
    let db = null;
    try {
      if (window.supabase && window.supabase.createClient) {
        db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (e) { console.error('Supabase load error:', e); }

    let deferredPrompt = null;

    // --- PWA SERVICE WORKER ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.error(err));
      });
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      setTimeout(() => {
        const popup = document.getElementById('pwa-install-popup');
        if (popup) popup.classList.remove('hidden');
      }, 1500);
    });

    async function triggerPwaInstall() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') showToast('App installation initiated.', 'success');
      dismissPwaPopup();
    }

    function dismissPwaPopup() {
      document.getElementById('pwa-install-popup').classList.add('hidden');
    }

    // --- TOAST ALERTS ---
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const colors = {
        success: 'bg-emerald-700 text-white',
        error: 'bg-red-700 text-white',
        warning: 'bg-amber-600 text-white',
        info: 'bg-navy text-white'
      };
      toast.className = `${colors[type]} fade-in-popup pointer-events-auto text-xs px-4 py-3 rounded-xl shadow-xl border border-white/10`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'all 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    // --- ROUTER ---
    function navigate(view) {
      const app = document.getElementById('app-content');
      if (!app) return;
      window.scrollTo(0, 0);

      if (view === 'home') renderHome(app);
      else if (view === 'services') renderServices(app);
      else if (view === 'reviews') renderReviewsView(app);
      else if (view === 'courses') renderCourses(app);
      else if (view === 'request') renderRequestForm(app);
      else if (view === 'admin') renderAdmin(app);
    }

    // --- 1. HOME VIEW ---
    async function renderHome(container) {
      let reviews = [];
      let projects = [];

      if (db) {
        const { data: revData } = await db.from('reviews').select('*').eq('is_approved', true).limit(3);
        reviews = revData || [];

        const { data: projData } = await db.from('portfolio_projects').select('*').order('created_at', { ascending: false }).limit(3);
        projects = projData || [];
      }

      container.innerHTML = `
        <div class="space-y-16 py-4">
          
          <!-- Hero Section -->
          <section class="py-12 text-center max-w-4xl mx-auto space-y-6">
            
            <!-- Trust Badge Header -->
            <div class="inline-flex items-center space-x-2 px-4 py-1.5 bg-blue-50 border border-blue-200 text-cobalt rounded-full text-xs font-bold shadow-sm">
              <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
              <span>Trusted by 180+ Enterprise Clients & Developers</span>
            </div>

            <h1 class="text-4xl sm:text-6xl font-black text-navy leading-tight tracking-tight">
              Engineering High-Performance Software & Custom Portals.
            </h1>
            <p class="text-slate-600 text-base sm:text-lg max-w-2xl mx-auto">
              We deliver custom web platforms, school management portals, and career-driven software engineering bootcamps built for scaling organizations.
            </p>
            
            <div class="flex flex-col sm:flex-row justify-center gap-4 pt-2">
              <button onclick="navigate('request')" class="px-8 py-3.5 bg-cobalt text-white font-bold rounded-xl shadow-lg hover:bg-blue-700 transition-all text-xs">
                Start a Project
              </button>
              <button onclick="navigate('reviews')" class="px-8 py-3.5 bg-white border border-slate-300 text-navy font-bold rounded-xl hover:bg-slate-50 transition-all text-xs">
                Read Verified Reviews
              </button>
            </div>
          </section>

          <!-- Social Proof Bar -->
          <section class="grid grid-cols-2 md:grid-cols-4 gap-4 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm text-center">
            <div>
              <p class="text-2xl font-black text-navy">99.8%</p>
              <p class="text-[11px] text-slate-500 font-bold uppercase mt-0.5">Uptime & Reliability</p>
            </div>
            <div>
              <p class="text-2xl font-black text-cobalt">180+</p>
              <p class="text-[11px] text-slate-500 font-bold uppercase mt-0.5">Deployed Systems</p>
            </div>
            <div>
              <p class="text-2xl font-black text-navy">4.9 / 5.0</p>
              <p class="text-[11px] text-slate-500 font-bold uppercase mt-0.5">Average Client Rating</p>
            </div>
            <div>
              <p class="text-2xl font-black text-emerald-600">24/7</p>
              <p class="text-[11px] text-slate-500 font-bold uppercase mt-0.5">Technical Support</p>
            </div>
          </section>

          <!-- Featured Projects Showcase -->
          ${projects.length > 0 ? `
            <section class="space-y-6">
              <div class="border-b pb-3">
                <h2 class="text-xl font-bold text-navy">Recent Published Projects</h2>
                <p class="text-xs text-slate-500">Live platforms designed, developed, and deployed by B-TECH HUB.</p>
              </div>
              <div class="grid sm:grid-cols-2 md:grid-cols-3 gap-6">
                ${projects.map(p => `
                  <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col justify-between">
                    <img src="${p.image_url}" alt="${p.title}" class="w-full h-40 object-cover bg-slate-100" onerror="this.src='https://via.placeholder.com/400x200?text=Project+Image'" />
                    <div class="p-5 space-y-2 flex-1 flex flex-col justify-between">
                      <div>
                        <span class="text-[10px] font-bold text-cobalt uppercase tracking-wider">${p.tech_stack || 'Software'}</span>
                        <h3 class="font-bold text-sm text-navy mt-1">${p.title}</h3>
                        <p class="text-xs text-slate-600 mt-1 line-clamp-3">${p.description}</p>
                      </div>
                      ${p.live_url ? `<a href="${p.live_url}" target="_blank" class="inline-block pt-3 text-xs font-bold text-cobalt hover:underline">View Live Demo -></a>` : ''}
                    </div>
                  </div>
                `).join('')}
              </div>
            </section>
          ` : ''}

          <!-- Client Reviews Preview -->
          <section class="space-y-6">
            <div class="flex justify-between items-end border-b pb-3">
              <div>
                <h2 class="text-xl font-bold text-navy">Client Testimonials & Ratings</h2>
                <p class="text-xs text-slate-500">Verified feedback from business owners and developers using our services.</p>
              </div>
              <button onclick="navigate('reviews')" class="text-xs font-bold text-cobalt hover:underline">View All Reviews -></button>
            </div>

            <div class="grid md:grid-cols-3 gap-6">
              ${reviews.length > 0 ? reviews.map(r => `
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3 flex flex-col justify-between">
                  <div class="space-y-2">
                    <div class="text-amber-500 font-bold text-xs">Rating: ${r.rating || 5} / 5 Stars</div>
                    <p class="text-xs text-slate-700 italic">"${r.comment}"</p>
                  </div>
                  <div class="pt-3 border-t">
                    <p class="font-bold text-navy text-xs">${r.client_name}</p>
                    <p class="text-[10px] text-slate-400">${r.company_title || 'Client'}</p>
                  </div>
                </div>
              `).join('') : `
                <div class="col-span-3 bg-white p-6 rounded-2xl border text-center space-y-2">
                  <p class="text-xs text-slate-500">"B-TECH HUB built our school portal smoothly and on schedule. Highly recommended."</p>
                  <p class="font-bold text-navy text-xs">-- Royal Academy Portal Administration</p>
                </div>
              `}
            </div>
          </section>

          <!-- Email Subscription Card -->
          <section class="bg-navy text-white p-8 rounded-3xl shadow-xl border border-slate-800 max-w-3xl mx-auto space-y-4 text-center">
            <h3 class="text-2xl font-bold">Subscribe for Technical Updates & Release Notes</h3>
            <p class="text-xs text-slate-300 max-w-lg mx-auto">
              Get direct email notifications regarding upcoming software releases, system upgrades, and new technical bootcamps.
            </p>
            
            <div class="flex flex-col sm:flex-row gap-2 max-w-md mx-auto pt-2">
              <input id="sub-email" type="email" placeholder="Enter your business email address" class="flex-1 px-4 py-3 rounded-xl text-xs text-navy focus:outline-none" />
              <button onclick="subscribeNewsletter()" class="px-6 py-3 bg-cobalt hover:bg-blue-600 font-bold text-xs text-white rounded-xl shadow transition-all">
                Subscribe
              </button>
            </div>
          </section>

        </div>
      `;
    }

    // --- 2. REVIEWS VIEW ---
    async function renderReviewsView(container) {
      container.innerHTML = `<p class="text-center py-12 text-slate-500">Loading client feedback...</p>`;

      let reviews = [];
      if (db) {
        const { data } = await db.from('reviews').select('*').order('created_at', { ascending: false });
        reviews = data || [];
      }

      container.innerHTML = `
        <div class="space-y-8 max-w-4xl mx-auto">
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b pb-4">
            <div>
              <h2 class="text-2xl font-black text-navy">Client & Student Reviews</h2>
              <p class="text-xs text-slate-500">Authentic ratings from verified clients and academy students.</p>
            </div>
            <button onclick="showReviewModal()" class="px-4 py-2.5 bg-cobalt text-white text-xs font-bold rounded-xl shadow">
              Submit a Review
            </button>
          </div>

          <div class="grid sm:grid-cols-2 gap-6">
            ${reviews.map(r => `
              <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                <div class="flex justify-between items-center">
                  <span class="text-xs font-bold text-amber-500">Rating: ${r.rating || 5} / 5 Stars</span>
                  <span class="text-[10px] text-slate-400">${new Date(r.created_at).toLocaleDateString()}</span>
                </div>
                <p class="text-xs text-slate-700 italic">"${r.comment}"</p>
                <div class="pt-2 border-t">
                  <p class="font-bold text-navy text-xs">${r.client_name}</p>
                  <p class="text-[10px] text-slate-400">${r.company_title || 'Client'}</p>
                </div>
              </div>
            `).join('')}
            ${reviews.length === 0 ? '<p class="text-xs text-slate-400 col-span-2 py-8 text-center bg-white rounded-2xl border">No reviews published yet. Be the first to leave one!</p>' : ''}
          </div>
        </div>

        <!-- Submit Review Modal -->
        <div id="review-modal" class="hidden fixed inset-0 bg-navy/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div class="bg-white max-w-md w-full p-6 rounded-2xl shadow-2xl space-y-4 border">
            <div class="flex justify-between items-center border-b pb-3">
              <h3 class="font-bold text-base text-navy">Write a Review</h3>
              <button onclick="hideReviewModal()" class="text-slate-400 hover:text-navy font-bold text-xs">X</button>
            </div>
            <div class="space-y-3">
              <input id="rev-name" type="text" placeholder="Your Name or Organization" class="w-full p-2.5 border rounded-xl text-xs" />
              <input id="rev-title" type="text" placeholder="Your Title (e.g. CEO, School Administrator)" class="w-full p-2.5 border rounded-xl text-xs" />
              <select id="rev-rating" class="w-full p-2.5 border rounded-xl text-xs bg-white">
                <option value="5">5 / 5 Stars -- Excellent Quality</option>
                <option value="4">4 / 5 Stars -- Very Good</option>
                <option value="3">3 / 5 Stars -- Satisfactory</option>
              </select>
              <textarea id="rev-comment" rows="4" placeholder="Write your honest review here..." class="w-full p-2.5 border rounded-xl text-xs"></textarea>
              <button onclick="submitReview()" class="w-full py-3 bg-cobalt text-white font-bold text-xs rounded-xl shadow-md">Post Review</button>
            </div>
          </div>
        </div>
      `;
    }

    function showReviewModal() { document.getElementById('review-modal').classList.remove('hidden'); }
    function hideReviewModal() { document.getElementById('review-modal').classList.add('hidden'); }

    async function submitReview() {
      const client_name = document.getElementById('rev-name').value.trim();
      const company_title = document.getElementById('rev-title').value.trim();
      const rating = parseInt(document.getElementById('rev-rating').value) || 5;
      const comment = document.getElementById('rev-comment').value.trim();

      if (!client_name || !comment) return showToast('Please provide your name and review details.', 'warning');

      if (db) {
        const { error } = await db.from('reviews').insert([{ client_name, company_title, rating, comment, is_approved: true }]);
        if (error) return showToast('Error submitting review: ' + error.message, 'error');
      }

      showToast('Thank you for your feedback!', 'success');
      hideReviewModal();
      navigate('reviews');
    }

    // --- 3. NEWSLETTER SUBSCRIPTION ACTION ---
    async function subscribeNewsletter() {
      const emailInput = document.getElementById('sub-email');
      const email = emailInput ? emailInput.value.trim() : '';

      if (!email || !email.includes('@')) {
        return showToast('Please enter a valid email address.', 'warning');
      }

      if (db) {
        const { error } = await db.from('subscribers').insert([{ email }]);
        if (error && !error.message.includes('unique')) {
          return showToast('Error subscribing: ' + error.message, 'error');
        }
      }

      showToast('Subscription confirmed! You will receive future updates via email.', 'success');
      if (emailInput) emailInput.value = '';
    }

    // --- 4. ADMIN CONTROL ROOM VIEW ---
    async function renderAdmin(container) {
      container.innerHTML = `
        <div class="space-y-8 max-w-6xl mx-auto">
          
          <!-- Control Room Header -->
          <div class="bg-navy text-white p-6 rounded-2xl border border-slate-800 shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <span class="text-[10px] font-black text-blue-400 tracking-widest uppercase">System Operations</span>
              <h1 class="text-2xl font-black tracking-tight">Admin Control Room</h1>
              <p class="text-xs text-slate-400 mt-1">Manage system updates, project showcases, and team permissions.</p>
            </div>
            <div class="flex space-x-2">
              <span class="px-3 py-1.5 bg-emerald-950 text-emerald-400 border border-emerald-800 rounded-lg text-xs font-bold">
                System Online

          <div class="flex border-b border-slate-200 text-xs font-bold space-x-6">

            <button onclick="switchControlTab('updates')" id="tab-btn-updates" class="pb-3 border-b-2 border-transparent text-slate-500 hover:text-navy">Post Updates</button>
            <button onclick="switchControlTab('admins')" id="tab-btn-admins" class="pb-3 border-b-2 border-transparent text-slate-500 hover:text-navy">Assign Admins</button>
          </div>

          <!-- TAB 1: PROJECT MANAGER -->
          <div id="tab-projects" class="space-y-6">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
              <h3 class="font-bold text-navy text-sm border-b pb-2">Publish Recent Project</h3>
              <div class="grid md:grid-cols-2 gap-4">
                <input id="proj-title" type="text" placeholder="Project Title (e.g. Enterprise Portal)" class="p-3 border rounded-xl text-xs" />
                <input id="proj-image" type="url" placeholder="Direct Image URL (e.g. https://.../image.png)" class="p-3 border rounded-xl text-xs" />
                <input id="proj-tech" type="text" placeholder="Tech Stack (e.g. Tailwind, Supabase, JS)" class="p-3 border rounded-xl text-xs" />
                <input id="proj-link" type="url" placeholder="Live Demo Link (Optional)" class="p-3 border rounded-xl text-xs" />
              </div>
              <textarea id="proj-desc" rows="3" placeholder="Brief project overview and key deliverables..." class="w-full p-3 border rounded-xl text-xs"></textarea>
              <button onclick="saveProject()" class="px-6 py-3 bg-cobalt text-white font-bold text-xs rounded-xl shadow hover:bg-blue-700">
                Publish Project to Site
              </button>
            </div>

            <div id="admin-projects-list" class="grid sm:grid-cols-2 md:grid-cols-3 gap-4">
              <!-- Live projects load dynamically -->
            </div>
          </div>

          <!-- TAB 2: POST UPDATES -->
          <div id="tab-updates" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
              <h3 class="font-bold text-navy text-sm border-b pb-2">Broadcast System Update / Announcement</h3>
              <input id="update-subject" type="text" placeholder="Update Title / Announcement Subject" class="w-full p-3 border rounded-xl text-xs" />
              <textarea id="update-body" rows="5" placeholder="Write full update details for subscribers and visitors..." class="w-full p-3 border rounded-xl text-xs"></textarea>
              <button onclick="publishUpdate()" class="px-6 py-3 bg-navy text-white font-bold text-xs rounded-xl shadow hover:bg-slate-800">
                Publish Announcement
              </button>
            </div>
          </div>

          <!-- TAB 3: ASSIGN ADMINS -->
          <div id="tab-admins" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
              <h3 class="font-bold text-navy text-sm border-b pb-2">Assign New System Administrator</h3>
              <div class="flex flex-col sm:flex-row gap-3">
                <input id="admin-email" type="email" placeholder="Enter team member email address" class="flex-1 p-3 border rounded-xl text-xs" />
                <select id="admin-role" class="p-3 border rounded-xl text-xs bg-white">
                  <option value="admin">Administrator</option>
                  <option value="super_admin">Super Administrator</option>
                </select>
                <button onclick="assignAdmin()" class="px-6 py-3 bg-cobalt text-white font-bold text-xs rounded-xl shadow hover:bg-blue-700">
                  Grant Admin Access
                </button>
              </div>
            </div>

            <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
              <div class="p-4 bg-slate-50 border-b font-bold text-xs text-navy">Active System Administrators</div>
              <div id="admin-list-table" class="divide-y divide-slate-100 text-xs">
                <!-- Active admins load dynamically -->
              </div>
            </div>
          </div>

        </div>
      `;

      loadAdminProjects();
      loadAdminList();
    }

    // --- CONTROL ROOM TAB CONTROLLER ---
    function switchControlTab(tabName) {
      const tabs = ['projects', 'updates', 'admins'];
      tabs.forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
        const btn = document.getElementById(`tab-btn-${t}`);
        btn.classList.remove('border-cobalt', 'text-cobalt');
        btn.classList.add('border-transparent', 'text-slate-500');
      });

      document.getElementById(`tab-${tabName}`).classList.remove('hidden');
      const activeBtn = document.getElementById(`tab-btn-${tabName}`);
      activeBtn.classList.remove('border-transparent', 'text-slate-500');
      activeBtn.classList.add('border-cobalt', 'text-cobalt');
    }

    // --- PROJECT PUBLISHING LOGIC ---
    async function saveProject() {
      const title = document.getElementById('proj-title').value.trim();
      const image_url = document.getElementById('proj-image').value.trim();
      const tech_stack = document.getElementById('proj-tech').value.trim();
      const live_url = document.getElementById('proj-link').value.trim();
      const description = document.getElementById('proj-desc').value.trim();

      if (!title || !image_url || !description) {
        return showToast('Title, Image URL, and Description are required.', 'warning');
      }

      if (db) {
        const { error } = await db.from('portfolio_projects').insert([{ title, image_url, tech_stack, live_url, description }]);
        if (error) return showToast('Error saving project: ' + error.message, 'error');
      }

      showToast('Project successfully published!', 'success');
      loadAdminProjects();
    }

    async function loadAdminProjects() {
      const container = document.getElementById('admin-projects-list');
      if (!container || !db) return;

      const { data } = await db.from('portfolio_projects').select('*').order('created_at', { ascending: false });
      if (!data || data.length === 0) {
        container.innerHTML = `<p class="col-span-full text-xs text-slate-400 text-center py-6 border rounded-xl bg-white">No portfolio projects published yet.</p>`;
        return;
      }

      container.innerHTML = data.map(p => `
        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm flex flex-col justify-between">
          <img src="${p.image_url}" alt="${p.title}" class="w-full h-36 object-cover bg-slate-100" onerror="this.src='https://via.placeholder.com/400x200?text=Project+Image'" />
          <div class="p-4 space-y-2 flex-1">
            <span class="text-[10px] font-bold text-cobalt uppercase">${p.tech_stack || 'Software'}</span>
            <h4 class="font-bold text-xs text-navy">${p.title}</h4>
            <p class="text-[11px] text-slate-500 line-clamp-2">${p.description}</p>
          </div>
        </div>
      `).join('');
    }

    // --- UPDATE BROADCAST LOGIC ---
    async function publishUpdate() {
      const subject = document.getElementById('update-subject').value.trim();
      const body = document.getElementById('update-body').value.trim();

      if (!subject || !body) return showToast('Subject and Update Body are required.', 'warning');

      if (db) {
        const { error } = await db.from('updates').insert([{ subject, body, published_by: 'Super Admin' }]);
        if (error) return showToast('Error publishing update: ' + error.message, 'error');
      }

      showToast('Announcement published successfully.', 'success');
      document.getElementById('update-subject').value = '';
      document.getElementById('update-body').value = '';
    }

    // --- ADMIN ASSIGNMENT LOGIC ---
    async function assignAdmin() {
      const email = document.getElementById('admin-email').value.trim();
      const role = document.getElementById('admin-role').value;

      if (!email || !email.includes('@')) return showToast('Enter a valid email address.', 'warning');

      if (db) {
        const { error } = await db.from('admins').insert([{ email, role, assigned_by: 'Owner' }]);
        if (error) return showToast('Error assigning admin: ' + error.message, 'error');
      }

      showToast(`Admin access granted to ${email}`, 'success');
      document.getElementById('admin-email').value = '';
      loadAdminList();
    }

    async function loadAdminList() {
      const container = document.getElementById('admin-list-table');
      if (!container || !db) return;

      const { data } = await db.from('admins').select('*').order('created_at', { ascending: false });
      if (!data || data.length === 0) {
        container.innerHTML = `<div class="p-4 text-slate-400 text-center">No additional admins assigned yet.</div>`;
        return;
      }

      container.innerHTML = data.map(a => `
        <div class="p-4 flex justify-between items-center hover:bg-slate-50">
          <div>
            <p class="font-bold text-navy">${a.email}</p>
            <p class="text-[10px] text-slate-400">Assigned: ${new Date(a.created_at).toLocaleDateString()}</p>
          </div>
          <span class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-blue-50 text-cobalt border border-blue-200 uppercase">
            ${a.role}
          </span>
        </div>
      `).join('');
    }

    // --- OTHER VIEWS ---
    function renderServices(container) {
      container.innerHTML = `
        <div class="space-y-6">
          <h2 class="text-2xl font-bold text-navy">Engineering Services</h2>
          <div class="grid sm:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-2">
              <h3 class="font-bold text-lg text-cobalt">Web Platform Development</h3>
              <p class="text-slate-600 text-xs">Custom business applications, APIs, and scalable infrastructure.</p>
            </div>
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-2">
              <h3 class="font-bold text-lg text-cobalt">Educational Management Systems</h3>
              <p class="text-slate-600 text-xs">Student enrollment tools, grade management systems, and admin portals.</p>
            </div>
          </div>
        </div>
      `;
    }

    function renderCourses(container) {
      container.innerHTML = `
        <div class="bg-white p-6 rounded-2xl border border-slate-200 text-center space-y-2">
          <h2 class="font-bold text-lg text-navy">B-TECH HUB Coding Academy</h2>
          <p class="text-xs text-slate-500">Live bootcamps and vibe coding modules will appear here.</p>
        </div>
      `;
    }

    function renderRequestForm(container) {
      container.innerHTML = `
        <div class="max-w-md mx-auto bg-white p-6 rounded-2xl border border-slate-200 space-y-4">
          <h2 class="text-xl font-bold text-navy">Start a Project</h2>
          <input id="p-name" type="text" placeholder="Organization / Project Name" class="w-full p-3 border rounded-xl text-xs" />
          <textarea id="p-desc" rows="4" placeholder="Briefly describe required features..." class="w-full p-3 border rounded-xl text-xs"></textarea>
          <button onclick="submitProject()" class="w-full py-3 bg-cobalt text-white font-bold text-xs rounded-xl shadow-md">Submit Proposal</button>
        </div>
      `;
    }

    async function submitProject() {
      const name = document.getElementById('p-name').value.trim();
      const description = document.getElementById('p-desc').value.trim();
      if (!name || !description) return showToast('Please complete all fields.', 'warning');
      if (db) await db.from('projects').insert([{ name, description, status: 'NEW_REQUEST' }]);
      showToast('Proposal submitted successfully!', 'success');
      navigate('home');
    }

    // Initialize Default View
    document.addEventListener('DOMContentLoaded', () => { navigate('home'); });
  </script>
</body>
</html>
