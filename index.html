<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>B-TECH HUB — Build • Learn • Vibe Code</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#07142F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="B-Tech Hub">
  <link rel="apple-touch-icon" href="logo.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { cobalt: '#1238C7', navy: '#07142F', 'light-bg': '#F8FAFC' }
        }
      }
    }
  </script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    
    /* Smooth Fade-In Animation for PWA Popup & Toasts */
    .fade-in-popup {
      animation: popupFadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes popupFadeIn {
      from { opacity: 0; transform: translateY(20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body class="bg-light-bg text-navy font-sans min-h-screen flex flex-col justify-between selection:bg-cobalt selection:text-white">

  <div id="offline-banner" class="hidden bg-amber-500 text-white text-[11px] font-bold text-center py-1 sticky top-0 z-[60]">
    ⚠️ You are operating offline. Some network actions will resume when online.
  </div>

  <nav class="bg-navy text-white sticky top-0 z-50 border-b border-slate-800 shadow-xl">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      
      <button onclick="navigate('home')" class="text-left flex items-center space-x-3 focus:outline-none">
        <div class="w-9 h-9 relative flex items-center justify-center">
          <img id="brand-logo" src="logo.png" alt="B-Tech Logo" class="w-full h-full object-contain rounded-lg" onerror="this.classList.add('hidden'); document.getElementById('logo-fallback').classList.remove('hidden');" />
          <div id="logo-fallback" class="hidden w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center font-black text-white text-base shadow-md">B</div>
        </div>
        <div>
          <span class="text-[10px] font-bold text-blue-400 tracking-wider block leading-none">B-TECH HUB</span>
          <span class="text-xs font-extrabold text-white tracking-tight">BUILD & LEARN</span>
        </div>
      </button>
      
      <div class="hidden md:flex space-x-6 text-xs font-semibold">
        <button onclick="navigate('home')" class="hover:text-blue-400 transition-colors">Home</button>
        <button onclick="navigate('services')" class="hover:text-blue-400 transition-colors">Services</button>
        <button onclick="navigate('courses')" class="hover:text-blue-400 transition-colors">Coding Academy</button>
        <button onclick="navigate('dashboard')" class="hover:text-blue-400 transition-colors">Student Portal</button>
        <button onclick="navigate('admin')" class="text-blue-400 font-bold hover:underline flex items-center space-x-1">
          <span>🔒</span>
          <span>Admin Portal</span>
        </button>
      </div>

      <div class="flex items-center space-x-3">
        <button onclick="navigate('request')" class="bg-cobalt hover:bg-blue-700 px-4 py-2 rounded-xl text-xs font-bold text-white shadow-md transition-all">
          Start Project
        </button>
      </div>
    </div>

    <div class="flex md:hidden justify-around py-2.5 border-t border-slate-800 text-[11px] bg-navy text-slate-300 font-medium">
      <button onclick="navigate('home')" class="p-1 hover:text-blue-400">Home</button>
      <button onclick="navigate('services')" class="p-1 hover:text-blue-400">Services</button>
      <button onclick="navigate('courses')" class="p-1 hover:text-blue-400">Academy</button>
      <button onclick="navigate('dashboard')" class="p-1 hover:text-blue-400">Student</button>
      <button onclick="navigate('admin')" class="p-1 text-blue-400 font-bold">Admin</button>
    </div>
  </nav>

  <main id="app-content" class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6">
    </main>

  <div id="pwa-install-popup" class="hidden fixed bottom-5 right-5 left-5 sm:left-auto sm:max-w-sm z-50 bg-navy text-white p-5 rounded-2xl shadow-2xl border border-slate-700 fade-in-popup space-y-3">
    <div class="flex items-start justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-cobalt rounded-xl flex items-center justify-center text-xl">📲</div>
        <div>
          <h4 class="font-bold text-sm text-white">Install B-TECH HUB</h4>
          <p class="text-[11px] text-slate-400">Access bootcamps & client tools offline.</p>
        </div>
      </div>
      <button onclick="dismissPwaPopup()" class="text-slate-400 hover:text-white text-base">✕</button>
    </div>
    <div class="flex space-x-2 pt-1">
      <button onclick="triggerPwaInstall()" class="flex-1 py-2 bg-emerald-600 hover:bg-emerald-700 font-bold text-xs text-white rounded-xl shadow transition-all">
        Install App
      </button>
      <button onclick="dismissPwaPopup()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300 rounded-xl">
        Not Now
      </button>
    </div>
  </div>

  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

  <footer class="bg-navy text-slate-400 text-xs py-6 border-t border-slate-800 mt-12 text-center">
    <p>© 2026 B-TECH HUB. Built for High-Performance Clients & Vibe Coders.</p>
  </footer>

  <script>
    // --- SUPABASE SETUP ---
    const SUPABASE_URL = 'https://argvofusfdrwengshbqw.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyZ3ZvZnVzZmRyd2VuZ3NoYnF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNjkxOTIsImV4cCI6MjEwMzg0NTE5Mn0.lS8P1NhaWVhyW3XMHz5ErC-aIXq-wsMrV8I9RFxtXIE';
    
    let db = null;
    try {
      if (window.supabase && window.supabase.createClient) {
        db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (e) { console.error('Supabase load error:', e); }

    let activeAdminTab = 'proposals';
    let deferredPrompt = null;

    // --- PWA SERVICE WORKER & FADE-IN POPUP ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.error(err));
      });
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      // Fade-in PWA prompt automatically
      setTimeout(() => {
        const popup = document.getElementById('pwa-install-popup');
        if (popup) popup.classList.remove('hidden');
      }, 1500);
    });

    async function triggerPwaInstall() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') showToast('App installed successfully!', 'success');
      dismissPwaPopup();
    }

    function dismissPwaPopup() {
      document.getElementById('pwa-install-popup').classList.add('hidden');
    }

    // --- TOAST ALERTS ---
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const colors = {
        success: 'bg-emerald-600 text-white',
        error: 'bg-red-600 text-white',
        warning: 'bg-amber-500 text-white',
        info: 'bg-navy text-white'
      };
      toast.className = `${colors[type]} fade-in-popup pointer-events-auto text-xs px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-2 border border-white/10`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'all 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    // --- GOOGLE OAUTH SIGN-IN ---
    async function loginWithGoogle() {
      if (!db) return showToast('Supabase connection missing.', 'error');
      const { error } = await db.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin }
      });
      if (error) showToast('Google sign in error: ' + error.message, 'error');
    }

    // --- ROUTER ---
    function navigate(view) {
      const app = document.getElementById('app-content');
      if (!app) return;
      window.scrollTo(0, 0);

      if (view === 'home') renderHome(app);
      else if (view === 'services') renderServices(app);
      else if (view === 'courses') renderCourses(app);
      else if (view === 'request') renderRequestForm(app);
      else if (view === 'dashboard') renderDashboard(app);
      else if (view === 'admin') renderAdmin(app);
    }

    // --- 1. CLIENT HOME PAGE ---
    function renderHome(container) {
      container.innerHTML = `
        <div class="space-y-16 py-6">
          <section class="py-12 text-center max-w-4xl mx-auto space-y-6">
            <span class="inline-block px-3.5 py-1.5 bg-blue-100 text-cobalt text-xs font-bold rounded-full uppercase tracking-wider">Engineering Agency & Coding Academy</span>
            <h1 class="text-4xl sm:text-6xl font-black text-navy leading-tight">Build Digital Products & Master Vibe Coding.</h1>
            <p class="text-slate-600 text-base sm:text-lg max-w-2xl mx-auto">From custom enterprise engineering & school portals to modern AI-assisted coding bootcamps and tips.</p>
            
            <div class="flex flex-col sm:flex-row justify-center gap-4 pt-4">
              <button onclick="navigate('request')" class="px-8 py-4 bg-cobalt text-white font-bold rounded-xl shadow-lg hover:bg-blue-700 transition-all text-sm">Start a Project</button>
              <button onclick="navigate('courses')" class="px-8 py-4 bg-white border border-slate-300 text-navy font-bold rounded-xl hover:bg-slate-50 transition-all text-sm">Explore Courses & Tips</button>
            </div>
          </section>

          <div class="grid sm:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-3">
              <div class="w-10 h-10 bg-blue-50 text-cobalt rounded-xl flex items-center justify-center font-bold">💻</div>
              <h3 class="font-bold text-base text-navy">Web & Mobile Engineering</h3>
              <p class="text-xs text-slate-600">Tailored web platforms, custom portals, and mobile-ready cross-platform solutions.</p>
            </div>
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-3">
              <div class="w-10 h-10 bg-blue-50 text-cobalt rounded-xl flex items-center justify-center font-bold">🎓</div>
              <h3 class="font-bold text-base text-navy">School & Business Portals</h3>
              <p class="text-xs text-slate-600">Complete administrative tools, registration workflows, and secure user management.</p>
            </div>
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-3">
              <div class="w-10 h-10 bg-blue-50 text-cobalt rounded-xl flex items-center justify-center font-bold">⚡</div>
              <h3 class="font-bold text-base text-navy">Vibe Coding & AI Tricks</h3>
              <p class="text-xs text-slate-600">Learn to build full-stack apps at 10x speed using AI prompt workflows and modern tools.</p>
            </div>
          </div>
        </div>
      `;
    }

    function renderServices(container) {
      container.innerHTML = `
        <div class="space-y-6">
          <h2 class="text-2xl font-bold text-navy">Services for Clients & Enterprises</h2>
          <div class="grid sm:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-2">
              <h3 class="font-bold text-lg text-cobalt">Full-Stack Web Engineering</h3>
              <p class="text-slate-600 text-xs">High-performance applications built with Tailwind CSS, JS, Supabase, and Node backends.</p>
            </div>
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-2">
              <h3 class="font-bold text-lg text-cobalt">School & University Portals</h3>
              <p class="text-slate-600 text-xs">Automated grading, enrollment, fee processing, and real-time dashboard analytics.</p>
            </div>
          </div>
        </div>
      `;
    }

    // --- 2. COURSES & SUBMISSION SCREEN ---
    async function renderCourses(container) {
      container.innerHTML = `<p class="text-center py-12 text-slate-500">Fetching approved courses & vibe coding tips...</p>`;
      
      let products = [];
      if (db) {
        const { data } = await db.from('products').select('*').eq('is_published', true).order('created_at', { ascending: false });
        products = data || [];
      }

      container.innerHTML = `
        <div class="space-y-8">
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b pb-4">
            <div>
              <h2 class="text-2xl font-black text-navy">Coding Academy & Course Marketplace</h2>
              <p class="text-xs text-slate-500">Explore published courses or submit your own video tutorial for verification.</p>
            </div>
            <button onclick="showCourseSubmissionModal()" class="px-4 py-2.5 bg-cobalt text-white text-xs font-bold rounded-xl shadow">
              📹 Submit Video Course
            </button>
          </div>

          <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
            ${products.map(c => `
              <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-3 flex flex-col justify-between">
                <div>
                  <div class="flex justify-between items-center">
                    <span class="text-[10px] font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded uppercase">${c.type || 'COURSE'}</span>
                    <span class="text-[10px] text-emerald-600 font-bold bg-emerald-50 px-2 py-0.5 rounded">VERIFIED</span>
                  </div>
                  <h3 class="font-bold text-base text-navy mt-2">${c.title}</h3>
                  <p class="text-xs text-slate-600 mt-1">${c.description}</p>
                </div>
                ${c.video_url ? `<a href="${c.video_url}" target="_blank" class="text-xs font-bold text-cobalt underline block">▶ Watch Video Lesson</a>` : ''}
                <div class="pt-4 border-t flex justify-between items-center">
                  <span class="font-bold text-navy text-base">${c.price > 0 ? '$' + c.price : 'FREE'}</span>
                  <button onclick="showToast('Course content unlocked!', 'success')" class="px-4 py-1.5 bg-navy text-white text-xs rounded-xl font-bold">Start Learning</button>
                </div>
              </div>
            `).join('')}
            ${products.length === 0 ? '<p class="text-xs text-slate-400 col-span-3 py-8 text-center bg-white rounded-2xl border">No verified courses published yet.</p>' : ''}
          </div>
        </div>

        <div id="course-submit-modal" class="hidden fixed inset-0 bg-navy/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div class="bg-white max-w-lg w-full p-6 rounded-2xl shadow-2xl space-y-4 border">
            <div class="flex justify-between items-center border-b pb-3">
              <h3 class="font-bold text-base text-navy">Submit Course for Admin Verification</h3>
              <button onclick="hideCourseSubmissionModal()" class="text-slate-400 hover:text-navy">✕</button>
            </div>
            <div class="space-y-3">
              <input id="new-c-title" type="text" placeholder="Course / Tutorial Title" class="w-full p-2.5 border rounded-xl text-xs" />
              <textarea id="new-c-desc" rows="3" placeholder="Detailed syllabus or video description..." class="w-full p-2.5 border rounded-xl text-xs"></textarea>
              <input id="new-c-video" type="url" placeholder="Clean Video URL (MP4 / Loom / YouTube)" class="w-full p-2.5 border rounded-xl text-xs" />
              <input id="new-c-photo" type="url" placeholder="Instructor Photo / Selfie Verification URL" class="w-full p-2.5 border rounded-xl text-xs" />
              <div class="grid grid-cols-2 gap-3">
                <select id="new-c-type" class="p-2.5 border rounded-xl text-xs bg-white">
                  <option value="VIDEO_COURSE">Clean Video Course</option>
                  <option value="VIBE_TIPS">Vibe Coding Trick</option>
                </select>
                <input id="new-c-price" type="number" step="0.01" placeholder="Price ($)" value="0.00" class="p-2.5 border rounded-xl text-xs" />
              </div>
              <p class="text-[10px] text-slate-500 bg-slate-100 p-2.5 rounded-xl">🔒 Submissions are held in **Pending Review** until verified by an Admin.</p>
              <button onclick="submitCourseForReview()" class="w-full py-3 bg-cobalt text-white font-bold text-xs rounded-xl shadow-md">Submit for Approval</button>
            </div>
          </div>
        </div>
      `;
    }

    function showCourseSubmissionModal() { document.getElementById('course-submit-modal').classList.remove('hidden'); }
    function hideCourseSubmissionModal() { document.getElementById('course-submit-modal').classList.add('hidden'); }

    async function submitCourseForReview() {
      const title = document.getElementById('new-c-title').value.trim();
      const description = document.getElementById('new-c-desc').value.trim();
      const video_url = document.getElementById('new-c-video').value.trim();
      const photo_url = document.getElementById('new-c-photo').value.trim();
      const type = document.getElementById('new-c-type').value;
      const price = parseFloat(document.getElementById('new-c-price').value) || 0;

      if (!title || !description || !video_url) {
        return showToast('Title, description, and clean video link are required.', 'error');
      }

      if (db) {
        const { error } = await db.from('products').insert([{
          title, description, video_url, photo_url, type, price,
          is_published: false, status: 'PENDING_REVIEW'
        }]);
        if (error) return showToast('Error submitting course: ' + error.message, 'error');
      }

      showToast('Submitted successfully! Pending Admin verification.', 'success');
      hideCourseSubmissionModal();
    }

    // --- 3. STUDENT PORTAL WITH GOOGLE SIGN-IN ---
    function renderDashboard(container) {
      container.innerHTML = `
        <div class="max-w-md mx-auto bg-white p-6 sm:p-8 rounded-2xl border border-slate-200 shadow-xl space-y-6 text-center">
          <div class="w-12 h-12 bg-blue-50 text-cobalt rounded-2xl flex items-center justify-center mx-auto text-xl font-bold">🎓</div>
          <div>
            <h2 class="text-2xl font-black text-navy">Student & Client Portal</h2>
            <p class="text-xs text-slate-500 mt-1">Sign in to track your software projects or learn coding tips.</p>
          </div>

          <button onclick="loginWithGoogle()" class="w-full py-3 px-4 border border-slate-300 rounded-xl text-xs font-bold text-navy hover:bg-slate-50 flex items-center justify-center space-x-2 shadow-sm transition-all">
            <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.28v3.15C3.26 21.3 7.37 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.28C.46 8.21 0 10.05 0 12s.46 3.79 1.28 5.42l4-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.37 0 3.26 2.7 1.28 6.58l4 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
            <span>Continue with Google</span>
          </button>
        </div>
      `;
    }

    function renderRequestForm(container) {
      container.innerHTML = `
        <div class="max-w-md mx-auto bg-white p-6 rounded-2xl border space-y-4">
          <h2 class="text-xl font-bold text-navy">Submit Project Proposal</h2>
          <input id="p-name" type="text" placeholder="Company / Project Name" class="w-full p-3 border rounded-xl text-xs" />
          <textarea id="p-desc" rows="4" placeholder="Describe features, goals, and timeline..." class="w-full p-3 border rounded-xl text-xs"></textarea>
          <button onclick="submitProject()" class="w-full py-3 bg-cobalt text-white font-bold text-xs rounded-xl shadow-md">Submit Proposal</button>
        </div>
      `;
    }

    async function submitProject() {
      const name = document.getElementById('p-name').value.trim();
      const description = document.getElementById('p-desc').value.trim();
      if (!name || !description) return showToast('Please complete all fields.', 'warning');
      if (db) await db.from('projects').insert([{ name, description, status: 'NEW_REQUEST' }]);
      showToast('Proposal submitted!', 'success');
      navigate('home');
    }

    // --- 4. SECURE ADMIN PANEL WITH VERIFICATION PIPELINE ---
    async function renderAdmin(container) {
      container.innerHTML = `<p class="text-center py-12 text-slate-500">Checking authorization...</p>`;

      let user = null;
      if (db) {
        try {
          const { data } = await db.auth.getUser();
          user = data ? data.user : null;
        } catch(e) { console.error(e); }
      }

      if (!user) {
        container.innerHTML = `
          <div class="max-w-md mx-auto bg-white p-6 rounded-2xl border shadow-xl space-y-4 text-center">
            <div class="w-12 h-12 bg-navy text-blue-400 rounded-2xl flex items-center justify-center mx-auto text-xl font-bold">🔒</div>
            <h2 class="text-xl font-black text-navy">Admin Portal</h2>
            <input id="admin-email" type="email" placeholder="admin@btechhub.com" class="w-full p-3 border rounded-xl text-xs" />
            <input id="admin-password" type="password" placeholder="••••••••" class="w-full p-3 border rounded-xl text-xs" />
            <div class="grid grid-cols-2 gap-3 pt-2">
              <button onclick="loginAdmin()" class="py-3 bg-navy text-white font-bold text-xs rounded-xl">Sign In</button>
              <button onclick="signUpAdmin()" class="py-3 bg-cobalt text-white font-bold text-xs rounded-xl">Create Admin</button>
            </div>
          </div>
        `;
        return;
      }

      // Fetch Data
      let projects = [], pendingCourses = [], userRoles = [];
      if (db) {
        const [projRes, prodRes, roleRes] = await Promise.all([
          db.from('projects').select('*').order('created_at', { ascending: false }),
          db.from('products').select('*').order('created_at', { ascending: false }),
          db.from('user_roles').select('*').order('created_at', { ascending: false })
        ]);
        projects = projRes.data || [];
        pendingCourses = prodRes.data || [];
        userRoles = roleRes.data || [];
      }

      container.innerHTML = `
        <div class="space-y-6">
          <div class="flex justify-between items-center bg-navy text-white p-6 rounded-2xl shadow-xl">
            <div>
              <span class="text-[10px] text-emerald-400 font-bold uppercase">Authorized Admin Session</span>
              <h1 class="text-xl font-bold">${user.email}</h1>
            </div>
            <button onclick="logoutAdmin()" class="text-xs bg-red-600 px-4 py-2 rounded-xl text-white font-bold">Log Out</button>
          </div>

          <div class="flex border-b text-xs font-bold space-x-6">
            <button onclick="switchTab('proposals')" class="pb-2.5 border-b-2 ${activeAdminTab === 'proposals' ? 'border-cobalt text-cobalt' : 'border-transparent text-slate-500'}">Proposals (${projects.length})</button>
            <button onclick="switchTab('course-reviews')" class="pb-2.5 border-b-2 ${activeAdminTab === 'course-reviews' ? 'border-cobalt text-cobalt' : 'border-transparent text-slate-500'}">Course Reviews (${pendingCourses.length})</button>
            <button onclick="switchTab('team')" class="pb-2.5 border-b-2 ${activeAdminTab === 'team' ? 'border-cobalt text-cobalt' : 'border-transparent text-slate-500'}">Team Roles</button>
          </div>

          <div class="${activeAdminTab === 'proposals' ? '' : 'hidden'} space-y-3">
            ${projects.map(p => `
              <div class="bg-white p-4 rounded-xl border text-xs space-y-1">
                <h4 class="font-bold text-navy">${p.name}</h4>
                <p class="text-slate-600">${p.description}</p>
              </div>
            `).join('')}
          </div>

          <div class="${activeAdminTab === 'course-reviews' ? '' : 'hidden'} space-y-4">
            ${pendingCourses.map(c => `
              <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                <div class="flex justify-between items-start">
                  <div>
                    <span class="text-[10px] font-bold ${c.is_published ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'} px-2 py-0.5 rounded">
                      ${c.is_published ? 'PUBLISHED' : 'PENDING REVIEW'}
                    </span>
                    <h4 class="font-bold text-base text-navy mt-1">${c.title}</h4>
                    <p class="text-xs text-slate-600 mt-0.5">${c.description}</p>
                  </div>
                  <span class="font-bold text-navy text-sm">$${c.price}</span>
                </div>

                <div class="grid sm:grid-cols-2 gap-2 text-xs bg-slate-50 p-3 rounded-xl border">
                  <div>
                    <span class="font-bold text-slate-500 block text-[10px]">VIDEO COURSE URL</span>
                    <a href="${c.video_url}" target="_blank" class="text-cobalt underline truncate block">${c.video_url || 'No video provided'}</a>
                  </div>
                  <div>
                    <span class="font-bold text-slate-500 block text-[10px]">SELFIE / PHOTO VERIFICATION</span>
                    <a href="${c.photo_url}" target="_blank" class="text-cobalt underline truncate block">${c.photo_url || 'No photo provided'}</a>
                  </div>
                </div>

                <div class="flex space-x-2 pt-1">
                  ${!c.is_published ? `
                    <button onclick="approveCourse('${c.id}')" class="px-4 py-2 bg-emerald-600 text-white font-bold text-xs rounded-xl">Approve & Publish</button>
                  ` : ''}
                  <button onclick="deleteCourse('${c.id}')" class="px-4 py-2 bg-red-600 text-white font-bold text-xs rounded-xl">Remove</button>
                </div>
              </div>
            `).join('')}
          </div>

          <div class="${activeAdminTab === 'team' ? '' : 'hidden'} space-y-4">
            <div class="bg-white p-5 rounded-2xl border space-y-3 max-w-md">
              <h4 class="font-bold text-sm text-navy">Grant Authorized Admin Role</h4>
              <input id="r-email" type="email" placeholder="user@btechhub.com" class="w-full p-2.5 border rounded-xl text-xs" />
              <button onclick="handleAddRole()" class="w-full py-2.5 bg-emerald-600 text-white font-bold text-xs rounded-xl">Grant Access</button>
            </div>
          </div>
        </div>
      `;
    }

    function switchTab(tab) { activeAdminTab = tab; renderAdmin(document.getElementById('app-content')); }

    async function approveCourse(courseId) {
      if (db) {
        await db.from('products').update({ is_published: true, status: 'VERIFIED' }).eq('id', courseId);
        showToast('Course approved & published live!', 'success');
        renderAdmin(document.getElementById('app-content'));
      }
    }

    async function deleteCourse(courseId) {
      if (db) {
        await db.from('products').delete().eq('id', courseId);
        showToast('Course removed.', 'info');
        renderAdmin(document.getElementById('app-content'));
      }
    }

    async function handleAddRole() {
      const email = document.getElementById('r-email').value.trim();
      if (!email) return showToast('Enter email', 'error');
      if (db) await db.from('user_roles').insert([{ email, role: 'Super Admin' }]);
      showToast('Admin role granted', 'success');
      switchTab('team');
    }

    async function loginAdmin() {
      const email = document.getElementById('admin-email').value.trim();
      const password = document.getElementById('admin-password').value.trim();
      if (!email || !password) return showToast('Enter email and password', 'warning');
      if (db) {
        const { error } = await db.auth.signInWithPassword({ email, password });
        if (error) showToast('Login failed: ' + error.message, 'error');
        else navigate('admin');
      }
    }

    async function signUpAdmin() {
      const email = document.getElementById('admin-email').value.trim();
      const password = document.getElementById('admin-password').value.trim();
      if (!email || !password) return showToast('Enter email and password', 'warning');
      if (db) {
        const { error } = await db.auth.signUp({ email, password });
        if (error) showToast('Failed: ' + error.message, 'error');
        else navigate('admin');
      }
    }

    async function logoutAdmin() {
      if (db) { await db.auth.signOut(); navigate('admin'); }
    }

    document.addEventListener('DOMContentLoaded', () => { navigate('home'); });
  </script>
</body>
</html>
