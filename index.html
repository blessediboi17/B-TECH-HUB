<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B-TECH HUB — Build • Learn • Create • Grow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { cobalt: '#1238C7', navy: '#07142F', 'light-bg': '#F8FAFC' }
        }
      }
    }
  </script>
</head>
<body class="bg-light-bg text-navy font-sans min-h-screen flex flex-col justify-between">

  <!-- Top Navigation -->
  <nav class="bg-navy text-white sticky top-0 z-50 border-b border-slate-800 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <button onclick="navigate('home')" class="text-left flex items-center space-x-2">
        <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-black text-white text-sm">B</div>
        <div>
          <span class="text-[10px] font-bold text-blue-400 tracking-wider block">B-TECH HUB</span>
          <span class="text-xs font-extrabold text-white">BUILD & LEARN</span>
        </div>
      </button>
      
      <div class="hidden md:flex space-x-6 text-xs font-semibold">
        <button onclick="navigate('home')" class="hover:text-blue-400">Home</button>
        <button onclick="navigate('services')" class="hover:text-blue-400">Services</button>
        <button onclick="navigate('courses')" class="hover:text-blue-400">Courses</button>
        <button onclick="navigate('dashboard')" class="hover:text-blue-400">Client Portal</button>
        <button onclick="navigate('admin')" class="text-blue-400 font-bold hover:underline flex items-center space-x-1">
          <span>🔒</span>
          <span>Admin Portal</span>
        </button>
      </div>

      <button onclick="navigate('request')" class="bg-cobalt hover:bg-blue-700 px-4 py-2 rounded-lg text-xs font-semibold text-white shadow-md">
        Start Project
      </button>
    </div>

    <!-- Mobile Navigation Bar -->
    <div class="flex md:hidden justify-around py-2 border-t border-slate-800 text-[11px] bg-navy text-slate-300 font-medium">
      <button onclick="navigate('home')" class="p-1 hover:text-blue-400">Home</button>
      <button onclick="navigate('services')" class="p-1 hover:text-blue-400">Services</button>
      <button onclick="navigate('courses')" class="p-1 hover:text-blue-400">Courses</button>
      <button onclick="navigate('dashboard')" class="p-1 hover:text-blue-400">Client</button>
      <button onclick="navigate('admin')" class="p-1 text-blue-400 font-bold">Admin</button>
    </div>
  </nav>

  <!-- Dynamic Page Content (Renders Home by Default) -->
  <main id="app-content" class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6">
    <section class="py-12 text-center max-w-3xl mx-auto space-y-6">
      <span class="inline-block px-3 py-1 bg-blue-100 text-cobalt text-xs font-bold rounded-full uppercase tracking-wider">Software & Training Agency</span>
      <h1 class="text-4xl sm:text-5xl font-extrabold text-navy leading-tight">Build Digital Products & Master Technology.</h1>
      <p class="text-slate-600 text-base sm:text-lg">Custom web engineering, school management portals, mobile apps, and career-driven technical bootcamps.</p>
      <div class="flex flex-col sm:flex-row justify-center gap-4 pt-4">
        <button onclick="navigate('request')" class="px-6 py-3.5 bg-cobalt text-white font-semibold rounded-xl shadow-md hover:bg-blue-700">Start a Project</button>
        <button onclick="navigate('courses')" class="px-6 py-3.5 border border-slate-300 text-navy font-semibold rounded-xl hover:bg-white">Explore Courses</button>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="bg-navy text-slate-400 text-xs py-6 border-t border-slate-800 mt-12 text-center">
    <p>© 2026 B-TECH HUB. All rights reserved.</p>
  </footer>

  <script>
    // --- Safe Supabase Initialization ---
    const SUPABASE_URL = 'https://argvofusfdrwengshbqw.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyZ3ZvZnVzZmRyd2VuZ3NoYnF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNjkxOTIsImV4cCI6MjEwMzg0NTE5Mn0.lS8P1NhaWVhyW3XMHz5ErC-aIXq-wsMrV8I9RFxtXIE';
    
    let db = null;
    try {
      if (window.supabase && window.supabase.createClient) {
        db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (e) {
      console.error('Supabase failed to initialize:', e);
    }

    let activeAdminTab = 'projects';

    // Global Router
    function navigate(view) {
      const app = document.getElementById('app-content');
      if (!app) return;
      window.scrollTo(0, 0);

      if (view === 'home') renderHome(app);
      else if (view === 'services') renderServices(app);
      else if (view === 'courses') renderCourses(app);
      else if (view === 'request') renderRequestForm(app);
      else if (view === 'dashboard') renderDashboard(app);
      else if (view === 'admin') renderAdmin(app);
    }

    // Views
    function renderHome(container) {
      container.innerHTML = `
        <section class="py-12 text-center max-w-3xl mx-auto space-y-6">
          <span class="inline-block px-3 py-1 bg-blue-100 text-cobalt text-xs font-bold rounded-full uppercase tracking-wider">Software & Training Agency</span>
          <h1 class="text-4xl sm:text-5xl font-extrabold text-navy leading-tight">Build Digital Products & Master Technology.</h1>
          <p class="text-slate-600 text-base sm:text-lg">Custom web engineering, school management portals, mobile apps, and career-driven technical bootcamps.</p>
          <div class="flex flex-col sm:flex-row justify-center gap-4 pt-4">
            <button onclick="navigate('request')" class="px-6 py-3.5 bg-cobalt text-white font-semibold rounded-xl shadow-md hover:bg-blue-700">Start a Project</button>
            <button onclick="navigate('courses')" class="px-6 py-3.5 border border-slate-300 text-navy font-semibold rounded-xl hover:bg-white">Explore Courses</button>
          </div>
        </section>
      `;
    }

    function renderServices(container) {
      container.innerHTML = `
        <div class="space-y-6">
          <h2 class="text-2xl font-bold text-navy">Our Technical Services</h2>
          <div class="grid sm:grid-cols-2 gap-4">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-2">
              <h3 class="font-bold text-lg text-cobalt">Web Development</h3>
              <p class="text-slate-600 text-xs">Custom business applications, responsive portals, and backend APIs.</p>
            </div>
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-2">
              <h3 class="font-bold text-lg text-cobalt">School Portals</h3>
              <p class="text-slate-600 text-xs">Student gradebooks, registration forms, and administrative dashboards.</p>
            </div>
          </div>
        </div>
      `;
    }

    async function renderCourses(container) {
      container.innerHTML = `<div class="bg-white p-6 rounded-2xl border text-center space-y-2"><h3 class="font-bold text-lg text-navy">Modern Full-Stack Web Development</h3><p class="text-xs text-slate-500">HTML, Tailwind CSS, JavaScript, and Supabase integration.</p></div>`;
    }

    function renderRequestForm(container) {
      container.innerHTML = `
        <div class="max-w-md mx-auto bg-white p-6 rounded-2xl border space-y-4">
          <h2 class="text-xl font-bold text-navy">Submit Project Proposal</h2>
          <input id="p-name" type="text" placeholder="Project Name" class="w-full p-2.5 border rounded-xl text-xs" />
          <textarea id="p-desc" placeholder="Project details..." class="w-full p-2.5 border rounded-xl text-xs"></textarea>
          <button onclick="submitProject()" class="w-full py-2.5 bg-cobalt text-white font-bold text-xs rounded-xl">Submit</button>
        </div>
      `;
    }

    async function submitProject() {
      const name = document.getElementById('p-name').value;
      const description = document.getElementById('p-desc').value;
      if (!name) return alert('Enter project name');
      if (db) await db.from('projects').insert([{ name, description }]);
      alert('Proposal submitted!');
      navigate('home');
    }

    function renderDashboard(container) {
      container.innerHTML = `<div class="bg-white p-6 rounded-2xl border text-center"><h2 class="font-bold text-lg">Client Portal</h2><p class="text-xs text-slate-500 mt-1">Please sign in as a client to track your project progress.</p></div>`;
    }

    // --- ADMIN CONTROLLER & LOGIN SCREEN ---
    async function renderAdmin(container) {
      container.innerHTML = `<p class="text-center py-12 text-slate-500">Checking authentication...</p>`;

      let user = null;
      if (db) {
        try {
          const { data } = await db.auth.getUser();
          user = data ? data.user : null;
        } catch(e) { console.error(e); }
      }

      // SHOW LOGIN SCREEN IF NOT AUTHENTICATED
      if (!user) {
        container.innerHTML = `
          <div class="max-w-md mx-auto bg-white p-6 sm:p-8 rounded-2xl border border-slate-200 shadow-xl space-y-5 text-center">
            <div class="w-12 h-12 bg-navy text-blue-400 rounded-2xl flex items-center justify-center mx-auto text-xl font-bold">🔒</div>
            <div>
              <h2 class="text-2xl font-black text-navy">Admin Portal Sign In</h2>
              <p class="text-xs text-slate-500 mt-1">Sign in with your authorized admin account credentials.</p>
            </div>

            <div class="space-y-3 text-left">
              <div>
                <label class="block text-[10px] font-bold uppercase text-slate-600 mb-1">Email</label>
                <input id="admin-email" type="email" placeholder="admin@btechhub.com" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-cobalt focus:outline-none" />
              </div>
              <div>
                <label class="block text-[10px] font-bold uppercase text-slate-600 mb-1">Password</label>
                <input id="admin-password" type="password" placeholder="••••••••" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-cobalt focus:outline-none" />
              </div>
              
              <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="loginAdmin()" class="py-3 bg-navy hover:bg-slate-800 text-white font-bold text-xs rounded-xl shadow-lg transition-all">Sign In</button>
                <button onclick="signUpAdmin()" class="py-3 bg-cobalt hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow-lg transition-all">Create Admin</button>
              </div>
            </div>
          </div>
        `;
        return;
      }

      // SHOW DASHBOARD WHEN LOGGED IN
      let projects = [];
      if (db) {
        const { data } = await db.from('projects').select('*');
        projects = data || [];
      }

      container.innerHTML = `
        <div class="space-y-6">
          <div class="flex justify-between items-center bg-navy text-white p-6 rounded-2xl shadow-xl">
            <div>
              <span class="text-[10px] text-emerald-400 font-bold uppercase">Active Session</span>
              <h1 class="text-xl font-bold">${user.email}</h1>
            </div>
            <button onclick="logoutAdmin()" class="text-xs bg-red-600 hover:bg-red-700 px-4 py-2 rounded-xl text-white font-bold">Log Out</button>
          </div>

          <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
            <h3 class="font-bold text-base text-navy">Submitted Client Proposals (${projects.length})</h3>
            <div class="space-y-2">
              ${projects.map(p => `
                <div class="p-4 border rounded-xl space-y-1">
                  <h4 class="font-bold text-sm text-navy">${p.name}</h4>
                  <p class="text-xs text-slate-600">${p.description || 'No description provided.'}</p>
                </div>
              `).join('')}
              ${projects.length === 0 ? '<p class="text-xs text-slate-400">No project proposals found in database.</p>' : ''}
            </div>
          </div>
        </div>
      `;
    }

    async function loginAdmin() {
      const email = document.getElementById('admin-email').value.trim();
      const password = document.getElementById('admin-password').value.trim();
      if (!email || !password) return alert('Please enter email and password.');

      if (db) {
        const { error } = await db.auth.signInWithPassword({ email, password });
        if (error) alert('Login failed: ' + error.message);
        else navigate('admin');
      }
    }

    async function signUpAdmin() {
      const email = document.getElementById('admin-email').value.trim();
      const password = document.getElementById('admin-password').value.trim();
      if (!email || !password) return alert('Please enter email and password.');

      if (db) {
        const { error } = await db.auth.signUp({ email, password });
        if (error) alert('Account creation failed: ' + error.message);
        else {
          alert('Admin account created! Logging in...');
          navigate('admin');
        }
      }
    }

    async function logoutAdmin() {
      if (db) {
        await db.auth.signOut();
        navigate('admin');
      }
    }

    // Default Load Action
    document.addEventListener('DOMContentLoaded', () => {
      navigate('home');
    });
  </script>
</body>
</html>
