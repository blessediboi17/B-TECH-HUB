  <!-- App Main Content Container -->

  <!-- Reusable Modal Window Host -->

  <script>
    // --- SUPABASE CONFIGURATION ---
    const SUPABASE_URL = 'https://argvofusfdrwengshbqw.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyZ3ZvZnVzZmRyd2VuZ3NoYnF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNjkxOTIsImV4cCI6MjEwMzg0NTE5Mn0.lS8P1NhaWVhyW3XMHz5ErC-aIXq-wsMrV8I9RFxtXIE';
    
    let db = null;
    try {
      if (window.supabase && window.supabase.createClient) {
        db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (e) { console.error('Supabase initialization failed:', e); }

    // --- APPLICATION STATE ---
    let activeAdminUser = null;
    let isCaptchaPassed = false;
    let uploadedSelfieBase64 = '';

    // --- TOAST ALERTS ---
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const styles = {
        success: 'bg-emerald-900 text-white border-emerald-700',
        error: 'bg-red-900 text-white border-red-700',
        warning: 'bg-amber-800 text-white border-amber-600',
        info: 'bg-navy text-white border-slate-700'
      };
      toast.className = `${styles[type]} fade-in pointer-events-auto text-xs px-4 py-3 rounded-xl shadow-2xl border font-medium`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'all 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    // --- ROUTER ---
    function navigate(view) {
      const container = document.getElementById('app-content');
      if (!container) return;
      closeModal();
      window.scrollTo(0, 0);

      if (view === 'home') renderHome(container);
      else if (view === 'portfolio') renderPortfolio(container);
      else if (view === 'team') renderTeamSection(container);
      else if (view === 'updates') renderUpdates(container);
      else if (view === 'tracker') renderProjectTracker(container);
      else if (view === 'hire') renderHireForm(container);
      else if (view === 'privacy') renderPrivacyPolicy(container);
      else if (view === 'admin') renderAdminGateway(container);
    }

    // --- MODAL SYSTEM ---
    function openModal(contentHtml) {
      const modal = document.getElementById('app-modal');
      const card = document.getElementById('modal-card');
      card.innerHTML = contentHtml;
      modal.classList.remove('hidden');
    }

    function closeModal() {
      const modal = document.getElementById('app-modal');
      if (modal) modal.classList.add('hidden');
    }

    // --- 1. HOME VIEW ---
    function renderHome(container) {
      container.innerHTML = `
        <div class="space-y-16 py-4 fade-in">

          <section class="py-12 text-center max-w-4xl mx-auto space-y-6">
            <div class="inline-flex items-center space-x-2 px-4 py-1.5 bg-blue-50 border border-blue-200 text-cobalt rounded-full text-xs font-bold shadow-sm">
              <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
              <span>Accepting New Web Engineering Contracts</span>
            </div>

            <h1 class="text-4xl sm:text-6xl font-black text-navy leading-tight tracking-tight">
              We Build High-Impact Websites For Your Organization.
            </h1>
            
            <p class="text-slate-600 text-base sm:text-lg max-w-2xl mx-auto leading-relaxed">

            </p>
            
            <div class="flex flex-col sm:flex-row justify-center gap-4 pt-2">
              <button onclick="navigate('hire')" class="px-8 py-3.5 bg-cobalt text-white font-bold rounded-xl shadow-lg hover:bg-blue-700 transition-all text-xs">
                Hire Our Team

              <button onclick="navigate('portfolio')" class="px-8 py-3.5 bg-white border border-slate-300 text-navy font-bold rounded-xl hover:bg-slate-50 transition-all text-xs">
                View Published Portfolio
              </button>
            </div>
          </section>

          <!-- Organization Sectors -->
          <section class="space-y-6">
            <div class="text-center max-w-xl mx-auto">
              <h2 class="text-2xl font-black text-navy">Specialized Institutional Systems</h2>
              <p class="text-xs text-slate-500 mt-1">Built for high reliability, mobile usability, and speed.</p>
            </div>

            <div class="grid sm:grid-cols-2 md:grid-cols-4 gap-4">
              <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                <span class="text-[10px] font-bold text-cobalt bg-blue-50 px-2.5 py-1 rounded-md uppercase">Churches</span>
                <h3 class="font-bold text-sm text-navy">Church Websites</h3>
                <p class="text-xs text-slate-500 leading-relaxed">Sermon media archives, live event feeds, integrated online tithes, and community portals.</p>
              </div>

              <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-3">

              </div>

              <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                <span class="text-[10px] font-bold text-cobalt bg-blue-50 px-2.5 py-1 rounded-md uppercase">Commercial</span>
                <h3 class="font-bold text-sm text-navy">Small Business Sites</h3>
                <p class="text-xs text-slate-500 leading-relaxed">E-commerce storefronts, automated consultation booking, service catalogs, and checkout flows.</p>
              </div>
            </div>
          </section>

          <!-- Interactive Quick Estimate Banner -->
          <section class="bg-navy text-white rounded-3xl p-8 border border-slate-800 shadow-2xl flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="space-y-2 text-center md:text-left">
              <span class="text-[10px] font-bold text-blue-400 uppercase tracking-widest">Instant Project Estimator</span>
              <h3 class="text-2xl font-black">Plan Your Digital Web Project Budget</h3>
              <p class="text-xs text-slate-400 max-w-lg">Calculate real-time estimates tailored for school portals, church sites, or custom software projects.</p>
            </div>
            <button onclick="navigate('hire')" class="px-6 py-3.5 bg-cobalt hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow-lg transition-all whitespace-nowrap">

        </div>

    }

    // --- 2. PORTFOLIO SHOWCASE VIEW ---

      container.innerHTML = `<p class="text-center py-12 text-slate-500 text-xs">Loading portfolio database...</p>`;

      let projects = [];
      if (db) {
        const { data } = await db.from('projects').select('*').order('created_at', { ascending: false });
        projects = data || [];
      }

      container.innerHTML = `
        <div class="space-y-8 max-w-6xl mx-auto fade-in">
          <div class="border-b pb-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <h1 class="text-2xl font-black text-navy">Engineering Portfolio</h1>
              <p class="text-xs text-slate-500 mt-1">Verified custom web platforms built by our team for client organizations.</p>
            </div>
            <button onclick="navigate('hire')" class="px-5 py-2.5 bg-cobalt text-white font-bold text-xs rounded-xl shadow">
              Hire Us For Your Website
            </button>
          </div>

          <div class="grid sm:grid-cols-2 md:grid-cols-3 gap-6">
            ${projects.map(p => `
              <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col justify-between hover:shadow-md transition-shadow">
                <img src="${p.image_url}" alt="${p.title}" class="w-full h-44 object-cover bg-slate-100" onerror="this.src='https://via.placeholder.com/600x400?text=Project+Preview'" />
                <div class="p-5 space-y-3 flex-1 flex flex-col justify-between">
                  <div>
                    <span class="text-[10px] font-black text-cobalt bg-blue-50 border border-blue-200 px-2.5 py-1 rounded-md uppercase">${p.category}</span>
                    <h3 class="font-bold text-sm text-navy mt-2.5">${p.title}</h3>
                    <p class="text-xs text-slate-600 mt-1 line-clamp-3">${p.description}</p>
                  </div>
                  ${p.live_url ? `<a href="${p.live_url}" target="_blank" class="inline-block pt-3 text-xs font-bold text-cobalt hover:underline">Visit Published App &rarr;</a>` : ''}
                </div>
              </div>
            `).join('')}
            ${projects.length === 0 ? '<p class="col-span-full py-12 text-center text-xs text-slate-400 bg-white border rounded-2xl">No portfolio projects published yet.</p>' : ''}

    // --- 3. TEAM DIRECTORY WITH READ-MORE MODAL ---
    async function renderTeamSection(container) {
      container.innerHTML = `<p class="text-center py-12 text-slate-500 text-xs">Loading team roster...</p>`;

      let team = [];
      if (db) {
        const { data } = await db.from('team_members').select('*').order('display_order', { ascending: true });
        team = data || [];
      }

      container.innerHTML = `
        <div class="space-y-8 max-w-6xl mx-auto fade-in">
          <div class="border-b pb-4 text-center max-w-xl mx-auto">
            <span class="text-[10px] font-bold text-cobalt bg-blue-50 px-2.5 py-1 rounded-md uppercase tracking-widest">Leadership & Developers</span>
            <h1 class="text-2xl font-black text-navy mt-2">Meet Our Engineering Team</h1>
            <p class="text-xs text-slate-500 mt-1">Dedicated software engineers, voice artists, and designers committed to your project.</p>
          </div>

          <div class="grid sm:grid-cols-2 md:grid-cols-3 gap-6">
            ${team.map(m => `
              <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm text-center flex flex-col items-center justify-between space-y-4">
                <img src="${m.image_url}" alt="${m.full_name}" class="w-28 h-28 object-cover rounded-full border-4 border-slate-100 shadow-md" onerror="this.src='https://via.placeholder.com/150?text=Team+Member'" />
                <div class="space-y-1">
                  <h3 class="font-bold text-navy text-base">${m.full_name}</h3>
                  <p class="text-xs font-semibold text-cobalt">${m.job_title}</p>
                  <p class="text-xs text-slate-600 line-clamp-3 pt-2 text-left leading-relaxed">${m.short_bio}</p>
                </div>
                <button onclick="showTeamMemberModal('${m.id}')" class="w-full py-2 bg-slate-100 hover:bg-blue-50 text-navy font-bold text-xs rounded-xl transition-all">
                  Read Full Bio & Profile
                </button>
              </div>
            `).join('')}
            ${team.length === 0 ? '<p class="col-span-full py-12 text-center text-xs text-slate-400 bg-white border rounded-2xl">No team profiles added yet. Control Room admins can add team bios.</p>' : ''}
          </div>
        </div>
      `;
    }

    async function showTeamMemberModal(memberId) {
      if (!db) return;
      const { data: m } = await db.from('team_members').select('*').eq('id', memberId).single();
      if (!m) return;

      openModal(`
        <div class="space-y-4 text-left">
          <div class="flex items-center space-x-4 border-b pb-4">
            <img src="${m.image_url}" alt="${m.full_name}" class="w-16 h-16 object-cover rounded-full border-2 border-cobalt shadow" />
            <div>
              <h2 class="text-lg font-black text-navy">${m.full_name}</h2>
              <p class="text-xs font-bold text-cobalt">${m.job_title}</p>
            </div>
          </div>
          <div class="space-y-2">
            <h4 class="text-xs font-bold text-navy uppercase tracking-wider">Biography & Experience</h4>
            <p class="text-xs text-slate-700 leading-relaxed whitespace-pre-line">${m.full_bio || m.short_bio}</p>
          </div>
          <div class="pt-4 border-t text-right">
            <button onclick="closeModal()" class="px-5 py-2 bg-navy text-white font-bold text-xs rounded-xl">Close</button>
          </div>
        </div>
      `);
    }

    // --- 4. TEAM UPDATES WITH LIKES & COMMENTS ---
    async function renderUpdates(container) {
      container.innerHTML = `<p class="text-center py-12 text-slate-500 text-xs">Loading technical journal...</p>`;

      let updates = [];
      if (db) {
        const { data } = await db.from('updates').select('*').order('created_at', { ascending: false });
        updates = data || [];
      }

      container.innerHTML = `
        <div class="space-y-8 max-w-4xl mx-auto fade-in">
          <div class="border-b pb-4">
            <h1 class="text-2xl font-black text-navy">Team Updates & Technical Journal</h1>
            <p class="text-xs text-slate-500 mt-1">Official agency news, launch announcements, and system progress directly from our desk.</p>
          </div>

          <div class="space-y-6">
            ${updates.map(u => `
              <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                <div class="flex justify-between items-start border-b pb-3">
                  <div>
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Posted by ${u.author || 'Team'}</span>
                    <h2 class="text-lg font-bold text-navy mt-0.5">${u.title}</h2>
                  </div>
                  <span class="text-[10px] text-slate-400 font-mono">${new Date(u.created_at).toLocaleDateString()}</span>
                </div>

                <p class="text-xs text-slate-700 leading-relaxed whitespace-pre-line">${u.content}</p>

                <div class="flex items-center space-x-4 pt-3 border-t text-xs">
                  <button onclick="likeUpdate('${u.id}', ${u.likes_count || 0})" class="flex items-center space-x-1.5 px-3 py-1.5 bg-slate-100 hover:bg-blue-50 text-slate-700 hover:text-cobalt rounded-lg font-bold transition-all">
                    <span>Like Update</span>
                    <span id="likes-count-${u.id}" class="bg-white px-2 py-0.5 rounded text-[10px] border">${u.likes_count || 0}</span>
                  </button>
                </div>

                <div class="bg-slate-50 p-4 rounded-xl space-y-3 mt-4 border border-slate-100">
                  <h4 class="text-xs font-bold text-navy uppercase tracking-wider">Comments</h4>
                  <div id="comments-list-${u.id}" class="space-y-2 divide-y divide-slate-200 text-xs"></div>

                  <div class="pt-2 flex flex-col sm:flex-row gap-2">
                    <input id="comment-name-${u.id}" type="text" placeholder="Your Name" class="p-2.5 border rounded-xl text-xs sm:w-1/3 focus:ring-2 focus:ring-cobalt focus:outline-none" />
                    <input id="comment-text-${u.id}" type="text" placeholder="Write a comment..." class="p-2.5 border rounded-xl text-xs flex-1 focus:ring-2 focus:ring-cobalt focus:outline-none" />
                    <button onclick="postComment('${u.id}')" class="px-4 py-2.5 bg-navy text-white font-bold text-xs rounded-xl hover:bg-slate-800">
                      Post
                    </button>
                  </div>
                </div>

              </div>
            `).join('')}
            ${updates.length === 0 ? '<p class="py-12 text-center text-xs text-slate-400 bg-white border rounded-2xl">No team updates published yet.</p>' : ''}
          </div>
        </div>
      `;

      updates.forEach(u => loadComments(u.id));
    }

    async function likeUpdate(id, currentLikes) {
      if (!db) return;
      const updatedCount = currentLikes + 1;
      const { error } = await db.from('updates').update({ likes_count: updatedCount }).eq('id', id);
      
      if (!error) {
        const badge = document.getElementById(`likes-count-${id}`);
        if (badge) badge.innerText = updatedCount;
        showToast('Update liked.', 'success');
      }
    }

    async function loadComments(updateId) {
      const container = document.getElementById(`comments-list-${updateId}`);
      if (!container || !db) return;

      const { data } = await db.from('comments').select('*').eq('update_id', updateId).order('created_at', { ascending: true });
      
      if (!data || data.length === 0) {
        container.innerHTML = `<p class="text-[11px] text-slate-400 italic py-1">No comments yet.</p>`;
        return;
      }

      container.innerHTML = data.map(c => `
        <div class="pt-2 first:pt-0">
          <div class="flex justify-between text-[10px] font-bold text-navy">
            <span>${c.author_name}</span>
            <span class="text-slate-400 font-mono">${new Date(c.created_at).toLocaleDateString()}</span>
          </div>
          <p class="text-[11px] text-slate-600 mt-0.5">${c.comment_text}</p>
        </div>
      `).join('');
    }

    async function postComment(updateId) {
      const nameInput = document.getElementById(`comment-name-${updateId}`);
      const textInput = document.getElementById(`comment-text-${updateId}`);
      const author_name = nameInput.value.trim();
      const comment_text = textInput.value.trim();

      if (!author_name || !comment_text) return showToast('Name and comment text are required.', 'warning');

      if (db) {
        const { error } = await db.from('comments').insert([{ update_id: updateId, author_name, comment_text }]);
        if (error) return showToast('Error posting comment: ' + error.message, 'error');
      }

      showToast('Comment published.', 'success');
      nameInput.value = '';
      textInput.value = '';
      loadComments(updateId);
    }

    function renderProjectTracker(container) {
      container.innerHTML = `

    async function lookupProjectStatus() {
      const code = document.getElementById('tracker-input').value.trim().toUpperCase();

      resultBox.classList.remove('hidden');
      resultBox.innerHTML = `<p class="text-xs text-slate-400 text-center">Searching registry...</p>`;

      if (!db) return;
      const { data: req } = await db.from('hire_requests').select('*').eq('tracking_code', code).maybeSingle();

      if (!req) {
        resultBox.innerHTML = `<p class="text-xs text-red-600 text-center font-bold">No project record found matching code "${code}".</p>`;
        return;
      }

      const steps = ['IN_REVIEW', 'UI_DESIGN', 'DEVELOPMENT', 'TESTING', 'LAUNCHED'];
      const currentIndex = steps.indexOf(req.status);

      resultBox.innerHTML = `

    async function submitHireRequest() {

    function processSelfieUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        uploadedSelfieBase64 = e.target.result;
        document.getElementById('selfie-filename').innerText = file.name;
        document.getElementById('selfie-preview-img').src = uploadedSelfieBase64;
        document.getElementById('selfie-preview-box').classList.remove('hidden');
        showToast('Selfie uploaded.', 'info');
      };
      reader.readAsDataURL(file);
    }

    async function processAdminLogin() {
      const email = document.getElementById('login-email').value.trim();
      const pin = document.getElementById('login-pin').value.trim();

      if (!db) return;
      const { data: admin } = await db.from('admins').select('*').eq('email', email).maybeSingle();

      if (!admin) {
        return showToast('Account not found. Please register.', 'error');
      }

      if (admin.status === 'PENDING') {
        return openModal(`
          <div class="text-center space-y-3">
            <h3 class="text-lg font-black text-navy">Application Pending Approval</h3>
            <p class="text-xs text-slate-600">Your registration with selfie verification is currently awaiting Super Admin approval.</p>
            <button onclick="closeModal()" class="px-5 py-2 bg-navy text-white text-xs font-bold rounded-xl">OK</button>
          </div>
        `);
      }

      if (admin.status === 'REJECTED') {
        return showToast('This admin identity request was rejected by the Owner.', 'error');
      }

      if (admin.security_pin && admin.security_pin !== pin) {
        return showToast('Incorrect Security PIN.', 'error');
      }

      activeAdminUser = admin;
      showToast(`Authenticated as ${admin.full_name || admin.email}`, 'success');
      renderControlRoom(document.getElementById('app-content'));
    }

    async function submitAdminApplication() {
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const pin = document.getElementById('reg-pin').value.trim();

      if (!isCaptchaPassed) return showToast('Check "I am not a robot".', 'warning');
      if (!uploadedSelfieBase64) return showToast('Upload verification selfie photo.', 'warning');

      if (db) {
        const { error } = await db.from('admins').insert([{
          full_name: name,
          email,
          security_pin: pin,
          selfie_url: uploadedSelfieBase64,
          captcha_verified: true,
          status: 'PENDING'
        }]);
        if (error) return showToast('Registration failed: ' + error.message, 'error');
      }

      showToast('Application sent for Owner review.', 'success');
      switchAuthTab('login');
    }

              <input id="p-link" type="url" placeholder="Live Site URL" class="p-3 border rounded-xl" />
            </div>
            <textarea id="p-desc" rows="3" placeholder="Project description..." class="w-full p-3 border rounded-xl text-xs"></textarea>
            <button onclick="savePortfolioProject()" class="px-6 py-3 bg-cobalt text-white font-bold text-xs rounded-xl">Publish Project</button>
          </div>

          <!-- TAB 5: POST UPDATES -->
          <div id="panel-updates" class="hidden space-y-4 bg-white p-6 rounded-2xl border">
            <h3 class="font-bold text-navy text-sm border-b pb-2">Publish Technical Journal Update</h3>
            <input id="u-title" type="text" placeholder="Update Title" class="w-full p-3 border rounded-xl text-xs" />
            <textarea id="u-content" rows="5" placeholder="Update text..." class="w-full p-3 border rounded-xl text-xs"></textarea>
            <button onclick="saveTeamUpdate()" class="px-6 py-3 bg-navy text-white font-bold text-xs rounded-xl">Broadcast Update</button>
          </div>

        </div>
      `;

      loadAdminInquiries();
      loadAdminApprovals();
      loadAdminTeamList();
    }

    function switchAdminTab(tab) {
      ['inquiries', 'approvals', 'team', 'portfolio', 'updates'].forEach(t => {
        document.getElementById(`panel-${t}`).classList.add('hidden');
        const btn = document.getElementById(`admin-tab-${t}`);
        if (btn) {
          btn.classList.remove('border-cobalt', 'text-cobalt');
          btn.classList.add('border-transparent', 'text-slate-500');
        }
      });

      document.getElementById(`panel-${tab}`).classList.remove('hidden');
      const activeBtn = document.getElementById(`admin-tab-${tab}`);
      if (activeBtn) {
        activeBtn.classList.remove('border-transparent', 'text-slate-500');
        activeBtn.classList.add('border-cobalt', 'text-cobalt');
      }
    }

    async function loadAdminInquiries() {
      const container = document.getElementById('admin-inquiries-list');
      if (!container || !db) return;

      const { data } = await db.from('hire_requests').select('*').order('created_at', { ascending: false });
      if (!data || data.length === 0) {
        container.innerHTML = `<p class="py-6 text-center text-slate-400 bg-white border rounded-xl">No pending client requests.</p>`;
        return;
      }

      container.innerHTML = data.map(req => `
        <div class="bg-white p-4 rounded-xl border border-slate-200 space-y-2">
          <div class="flex justify-between items-center font-bold">
            <span class="text-navy">${req.client_name} (${req.email})</span>
            <select onchange="updateProjectStatus('${req.id}', this.value)" class="p-1 border rounded text-[11px] bg-slate-50 font-bold">
              <option value="IN_REVIEW" ${req.status === 'IN_REVIEW' ? 'selected' : ''}>IN_REVIEW</option>
              <option value="UI_DESIGN" ${req.status === 'UI_DESIGN' ? 'selected' : ''}>UI_DESIGN</option>
              <option value="DEVELOPMENT" ${req.status === 'DEVELOPMENT' ? 'selected' : ''}>DEVELOPMENT</option>
              <option value="TESTING" ${req.status === 'TESTING' ? 'selected' : ''}>TESTING</option>
              <option value="LAUNCHED" ${req.status === 'LAUNCHED' ? 'selected' : ''}>LAUNCHED</option>
            </select>
          </div>
          <p class="text-slate-600">${req.project_details}</p>
          <p class="text-[10px] text-slate-400 font-mono">TRACKING CODE: ${req.tracking_code}</p>
        </div>
      `).join('');
    }

    async function updateProjectStatus(id, newStatus) {
      if (!db) return;
      await db.from('hire_requests').update({ status: newStatus }).eq('id', id);
      showToast('Status updated.', 'success');
    }

    async function loadAdminApprovals() {
      const container = document.getElementById('admin-approvals-list');
      if (!container || !db) return;

      const { data } = await db.from('admins').select('*').eq('status', 'PENDING');
      if (!data || data.length === 0) {
        container.innerHTML = `<p class="py-6 text-center text-slate-400 bg-white border rounded-xl">No pending admin applications.</p>`;
        return;
      }

      container.innerHTML = data.map(a => `
        <div class="bg-white p-4 rounded-xl border flex justify-between items-center gap-4">
          <div class="flex items-center space-x-3">
            <img src="${a.selfie_url || 'https://via.placeholder.com/100'}" class="w-14 h-14 object-cover rounded-xl border" />
            <div>
              <h4 class="font-bold text-navy">${a.full_name || 'Applicant'}</h4>
              <p class="text-slate-500">${a.email}</p>
            </div>
          </div>
          <div class="flex space-x-2">
            <button onclick="approveAdmin('${a.id}', 'APPROVED')" class="px-3 py-1.5 bg-emerald-700 text-white font-bold rounded-lg">Approve</button>
            <button onclick="approveAdmin('${a.id}', 'REJECTED')" class="px-3 py-1.5 bg-red-700 text-white font-bold rounded-lg">Reject</button>
          </div>
        </div>
      `).join('');
    }

    async function approveAdmin(id, newStatus) {
      if (!db) return;
      await db.from('admins').update({ status: newStatus }).eq('id', id);
      showToast(`Admin application set to ${newStatus}`, 'success');
      loadAdminApprovals();
    }

    async function saveTeamMemberProfile() {
      const full_name = document.getElementById('tm-name').value.trim();
      const job_title = document.getElementById('tm-title').value.trim();
      const image_url = document.getElementById('tm-photo').value.trim();
      const display_order = parseInt(document.getElementById('tm-order').value) || 1;
      const short_bio = document.getElementById('tm-short').value.trim();
      const full_bio = document.getElementById('tm-full').value.trim();

      if (!full_name || !job_title || !image_url || !short_bio) {
        return showToast('Full name, title, photo URL, and short bio are required.', 'warning');
      }

      if (db) {
        const { error } = await db.from('team_members').insert([{ full_name, job_title, image_url, display_order, short_bio, full_bio }]);
        if (error) return showToast('Error saving team profile: ' + error.message, 'error');
      }

      showToast('Team member profile saved.', 'success');
      loadAdminTeamList();
    }

    async function loadAdminTeamList() {
      const container = document.getElementById('admin-team-directory');
      if (!container || !db) return;

      const { data } = await db.from('team_members').select('*').order('display_order', { ascending: true });
      if (!data || data.length === 0) {
        container.innerHTML = `<p class="text-slate-400">No team members added yet.</p>`;
        return;
      }

      container.innerHTML = data.map(m => `
        <div class="p-2 border rounded-lg flex justify-between items-center">
          <div>
            <span class="font-bold text-navy">${m.full_name}</span>
            <span class="text-slate-400"> (${m.job_title})</span>
          </div>
          <button onclick="deleteTeamMember('${m.id}')" class="text-red-600 font-bold">Remove</button>
        </div>
      `).join('');
    }

    async function deleteTeamMember(id) {
      if (!db) return;
      await db.from('team_members').delete().eq('id', id);
      showToast('Team profile removed.', 'info');
      loadAdminTeamList();
    }

    async function savePortfolioProject() {
      const title = document.getElementById('p-title').value.trim();
      const category = document.getElementById('p-category').value;
      const image_url = document.getElementById('p-image').value.trim();
      const live_url = document.getElementById('p-link').value.trim();
      const description = document.getElementById('p-desc').value.trim();

      if (!title || !image_url || !description) return showToast('Title, Image URL, and Description required.', 'warning');

      if (db) {
        await db.from('projects').insert([{ title, category, image_url, live_url, description }]);
      }

      showToast('Portfolio item published.', 'success');
      navigate('portfolio');
    }

    async function saveTeamUpdate() {
      const title = document.getElementById('u-title').value.trim();
      const content = document.getElementById('u-content').value.trim();

      if (!title || !content) return showToast('Title and content required.', 'warning');

      if (db) {
        await db.from('updates').insert([{ title, content, author: activeAdminUser.full_name || 'Team' }]);
      }

      showToast('Update broadcasted.', 'success');
      navigate('updates');
    }

    // Default Initialization
    document.addEventListener('DOMContentLoaded', () => { navigate('home'); });
  </script>
</body>
</html>
